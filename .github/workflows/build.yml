name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java
        run: javac -encoding UTF-8 EcosystemApp.java

      - name: Create JAR
        run: jar cfe EcosystemApp.jar EcosystemApp *.class

      - name: Package into EXE (with embedded JRE)
        run: jpackage --type app-image --name EcoMiniature --input . --main-jar EcosystemApp.jar --main-class EcosystemApp

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: EcoMiniature-Windows
          path: EcoMiniature/
          retention-days: 90
